# Render Blueprint for Tangent Standardized Investment Committee (CrewAI + Google ADK)
# Deploys ONLY the new/updated renamed microservices (Gateway + Agent) and connects
# to your existing frozen/unchanged services + a new isolated Upstash Redis database.

services:
  # 1. Renamed API Gateway (Reverse Proxy, Auth, Rate Limiting)
  - type: web
    name: tangent-committee-gateway
    runtime: docker
    dockerfilePath: services/gateway/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_URL
        value: https://tangent-committee-agent.onrender.com
      # Existing frozen/unchanged services on Render / Cloud Run (update if your URLs differ)
      - key: PERSONA_MACRO_URL
        value: https://tangent-persona-macro.onrender.com
      - key: PERSONA_GROWTH_URL
        value: https://tangent-persona-growth.onrender.com
      - key: PERSONA_RISK_URL
        value: https://tangent-persona-risk.onrender.com
      - key: OBSERVATORY_URL
        value: https://tangent-observatory.onrender.com
      - key: MARKET_DATA_URL
        sync: false
      - key: QUANT_URL
        sync: false
      - key: PORTFOLIO_URL
        sync: false
      - key: SENTIMENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # 2. Renamed Investment Committee Agent Service (CrewAI + Google ADK)
  - type: web
    name: tangent-committee-agent
    runtime: docker
    dockerfilePath: services/agent/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_MODE
        value: live
      - key: DEMO_MODE
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # New isolated Upstash Redis URL for Committee telemetry & Observatory
      - key: REDIS_URL
        sync: false
      # Existing frozen deterministic services for MCP Tools (optional; falls back cleanly if unset)
      - key: QUANT_SERVICE_URL
        sync: false
      - key: MARKET_DATA_SERVICE_URL
        sync: false
