[project]
name = "tangent-agent"
version = "0.1.0"
description = "Evidence-first AI Decision Studio agent service with traceable citations and SSE streaming"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tangent-common",
    "tangent-contracts",
    "tangent-llm",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "crewai>=0.100.0",
    "crewai-tools>=0.30.0",
    "google-genai>=1.0.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
